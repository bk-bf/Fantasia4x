[package]
name = "render-native"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { version = "30", features = ["serde"] }
naga = { version = "30", features = ["wgsl-in"] }
winit = "0.30"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
