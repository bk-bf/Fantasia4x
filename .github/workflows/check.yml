name: check

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base:
        description: Branch whose browser work pins are the base
        default: main
      head:
        description: Branch whose browser work pins are the head
        default: dev

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spatial-core
            sim-core

      - uses: ./.github/actions/wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM crates
        run: |
          (cd spatial-core && wasm-pack build --target web --out-dir ../src/lib/spatial-core-pkg)
          (cd sim-core && wasm-pack build --target web --out-dir ../src/lib/sim-core-pkg)

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: pnpm check and the related tests
        if: github.event_name != 'workflow_dispatch'
        env:
          CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: node tools/audit/ci-check.mjs

      - name: Work pins, base against head
        if: github.event_name == 'pull_request'
        run: node tools/work-pins/gate.mjs --base HEAD^1

      - name: Read the gungraun version
        id: gungraun
        if: github.event_name == 'pull_request'
        run: echo "version=$(cargo pkgid --manifest-path spatial-core/Cargo.toml gungraun | sed 's/.*@//')" >> "$GITHUB_OUTPUT"

      - uses: gungraun/setup-gungraun@v1.1.3
        if: github.event_name == 'pull_request'
        with:
          runner-version: ${{ steps.gungraun.outputs.version }}

      - name: Instruction counts, base against head
        if: github.event_name == 'pull_request'
        run: node tools/gungraun/gate.mjs --base HEAD^1 --home "$RUNNER_TEMP/gungraun"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: gungraun-flamegraphs
          path: ${{ runner.temp }}/gungraun/**/*.svg
          if-no-files-found: ignore

      - name: Install Chromium for the browser work pins
        if: github.event_name != 'push'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser work pins, base against head
        if: github.event_name == 'pull_request'
        run: node tools/work-pins/gate.mjs --leg browser --base HEAD^1

      - name: Browser work pins, two branches
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_BRANCH: ${{ inputs.base }}
          HEAD_BRANCH: ${{ inputs.head }}
        run: >-
          node tools/work-pins/gate.mjs --leg browser
          --base "origin/$BASE_BRANCH" --head "origin/$HEAD_BRANCH"
          --hook-from "$(git merge-base HEAD origin/dev)" --out work-pins-out

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: browser-work-pins
          path: work-pins-out
