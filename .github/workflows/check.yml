name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base:
        description: Branch whose browser work pins are the base
        default: main
      head:
        description: Branch whose browser work pins are the head
        default: dev
      leg:
        description: browser runs, pans and pans while paused; day steps one in-game day
        type: choice
        options: [browser, day]
        default: browser

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check, related tests, seams and work pins
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 300 || 90 }}
    permissions:
      contents: read
    env:
      BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare

      - name: What this change needs measured
        id: scope
        if: github.event_name != 'workflow_dispatch'
        run: node tools/audit/ci-scope.mjs --base "$BASE"

      - name: pnpm check and the related tests
        if: github.event_name != 'workflow_dispatch' && steps.scope.outputs.check == 'true'
        env:
          CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          WARNINGS_NOTES: ${{ runner.temp }}/warnings-notes.jsonl
        run: node tools/audit/ci-check.mjs

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: warnings-notes
          path: ${{ runner.temp }}/warnings-notes.jsonl
          if-no-files-found: ignore

      - name: Architecture seams and component sizes
        run: node tools/audit/audit.mjs t0

      - name: Work pins, base against head
        if: github.event_name != 'workflow_dispatch' && steps.scope.outputs.workPins == 'true'
        env:
          WORK_PINS_NOTES: ${{ runner.temp }}/work-pins-notes.jsonl
        run: node tools/work-pins/gate.mjs --base "$BASE"

      - name: Read the gungraun version
        id: gungraun
        if: github.event_name != 'workflow_dispatch' && steps.scope.outputs.gungraun == 'true'
        run: echo "version=$(cargo pkgid --manifest-path spatial-core/Cargo.toml gungraun | sed 's/.*@//')" >> "$GITHUB_OUTPUT"

      - uses: gungraun/setup-gungraun@v1.1.3
        if: github.event_name != 'workflow_dispatch' && steps.scope.outputs.gungraun == 'true'
        with:
          runner-version: ${{ steps.gungraun.outputs.version }}

      - name: Instruction counts, base against head
        if: github.event_name != 'workflow_dispatch' && steps.scope.outputs.gungraun == 'true'
        run: node tools/gungraun/gate.mjs --base "$BASE" --home "$RUNNER_TEMP/gungraun"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        with:
          name: gungraun-flamegraphs
          path: ${{ runner.temp }}/gungraun/**/*.svg
          if-no-files-found: ignore

      - name: Install Chromium for the browser work pins
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser work pins, base against head
        if: github.event_name != 'workflow_dispatch' && steps.scope.outputs.browser == 'true'
        env:
          WORK_PINS_NOTES: ${{ runner.temp }}/work-pins-notes.jsonl
        run: node tools/work-pins/gate.mjs --leg browser --base "$BASE"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: work-pins-notes
          path: ${{ runner.temp }}/work-pins-notes.jsonl
          if-no-files-found: ignore

      - name: Browser work pins, two branches
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_BRANCH: ${{ inputs.base }}
          HEAD_BRANCH: ${{ inputs.head }}
          LEG: ${{ inputs.leg }}
        run: >-
          node tools/work-pins/gate.mjs --leg "$LEG"
          --base "origin/$BASE_BRANCH" --head "origin/$HEAD_BRANCH"
          --hook-from "$(git merge-base HEAD origin/dev)" --out work-pins-out

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: browser-work-pins
          path: work-pins-out

  codspeed:
    name: CodSpeed benchmarks on ubuntuserver
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, ubuntuserver]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
    outputs:
      bench: ${{ steps.scope.outputs.bench }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: What this change needs measured
        id: scope
        run: node tools/audit/ci-scope.mjs --base "$BASE"

      - uses: ./.github/actions/prepare
        if: steps.scope.outputs.bench == 'true'

      - name: CodSpeed benchmarks
        if: steps.scope.outputs.bench == 'true'
        uses: CodSpeedHQ/action@v5
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          mode: simulation
          runner-version: 5.2.1
          cache-instruments: false
          run: pnpm bench

      - name: Exact counts from the profiles
        if: ${{ !cancelled() && steps.scope.outputs.bench == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/bench/counts.mjs "$RUNNER_TEMP" --out "$RUNNER_TEMP/codspeed-counts.json"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.scope.outputs.bench == 'true' }}
        with:
          name: codspeed-counts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codspeed-counts.json
          if-no-files-found: ignore

  tps:
    name: Ticks per second on ubuntuserver
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, ubuntuserver]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: What this change needs measured
        id: scope
        run: node tools/audit/ci-scope.mjs --base "$BASE"

      - uses: ./.github/actions/prepare
        if: steps.scope.outputs.tps == 'true'

      - name: Ticks per second, base against head
        if: steps.scope.outputs.tps == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tools/work-pins/gate.mjs --leg tps --base "$BASE"

  perf-notes:
    name: Check notes on the pull request
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [check, codspeed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: work-pins-notes
          path: ${{ runner.temp }}/notes

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: warnings-notes
          path: ${{ runner.temp }}/warnings

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: codspeed-counts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codspeed

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Check notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORK_PINS_NOTES: ${{ runner.temp }}/notes/work-pins-notes.jsonl
          WARNINGS_NOTES: ${{ runner.temp }}/warnings/warnings-notes.jsonl
          CODSPEED_COUNTS: ${{ runner.temp }}/codspeed/codspeed-counts.json
          CODSPEED_RAN: ${{ needs.codspeed.outputs.bench }}
        run: node tools/work-pins/perf-notes.mjs
