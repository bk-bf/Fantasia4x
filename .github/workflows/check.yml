name: check

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base:
        description: Branch whose browser work pins are the base
        default: main
      head:
        description: Branch whose browser work pins are the head
        default: dev
      leg:
        description: browser runs, pans and pans while paused; day steps one in-game day
        type: choice
        options: [browser, day]
        default: browser

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 300 || 90 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare

      - name: pnpm check and the related tests
        if: github.event_name != 'workflow_dispatch'
        env:
          CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: node tools/audit/ci-check.mjs

      - name: Architecture seams and component sizes
        run: node tools/audit/audit.mjs t0

      - name: Work pins, base against head
        if: github.event_name == 'pull_request'
        env:
          WORK_PINS_NOTES: ${{ runner.temp }}/work-pins-notes.jsonl
        run: node tools/work-pins/gate.mjs --base HEAD^1

      - name: Read the gungraun version
        id: gungraun
        if: github.event_name == 'pull_request'
        run: echo "version=$(cargo pkgid --manifest-path spatial-core/Cargo.toml gungraun | sed 's/.*@//')" >> "$GITHUB_OUTPUT"

      - uses: gungraun/setup-gungraun@v1.1.3
        if: github.event_name == 'pull_request'
        with:
          runner-version: ${{ steps.gungraun.outputs.version }}

      - name: Instruction counts, base against head
        if: github.event_name == 'pull_request'
        run: node tools/gungraun/gate.mjs --base HEAD^1 --home "$RUNNER_TEMP/gungraun"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: gungraun-flamegraphs
          path: ${{ runner.temp }}/gungraun/**/*.svg
          if-no-files-found: ignore

      - name: Install Chromium for the browser work pins
        if: github.event_name != 'push'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Browser work pins, base against head
        if: github.event_name == 'pull_request'
        env:
          WORK_PINS_NOTES: ${{ runner.temp }}/work-pins-notes.jsonl
        run: node tools/work-pins/gate.mjs --leg browser --base HEAD^1

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: work-pins-notes
          path: ${{ runner.temp }}/work-pins-notes.jsonl
          if-no-files-found: ignore

      - name: Browser work pins, two branches
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_BRANCH: ${{ inputs.base }}
          HEAD_BRANCH: ${{ inputs.head }}
          LEG: ${{ inputs.leg }}
        run: >-
          node tools/work-pins/gate.mjs --leg "$LEG"
          --base "origin/$BASE_BRANCH" --head "origin/$HEAD_BRANCH"
          --hook-from "$(git merge-base HEAD origin/dev)" --out work-pins-out

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: browser-work-pins
          path: work-pins-out

  codspeed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare

      - name: CodSpeed benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pnpm bench

  perf-notes:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [check, codspeed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: work-pins-notes
          path: ${{ runner.temp }}/notes

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Performance notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORK_PINS_NOTES: ${{ runner.temp }}/notes/work-pins-notes.jsonl
        run: node tools/work-pins/perf-notes.mjs
