<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ground by water</title>
<style>
:root { color-scheme: light dark; --bg: #f4f1ea; --fg: #1d1b18; --muted: #5d574d; --rule: #d9d2c3; --up: #2f6b3a; --down: #9a3a24; --cell: #ebe6da; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15140f; --fg: #ece7dc; --muted: #a39b8c; --rule: #34302a; --up: #8fd19b; --down: #f0a08a; --cell: #1f1d17; } }
:root[data-theme="dark"] { --bg: #15140f; --fg: #ece7dc; --muted: #a39b8c; --rule: #34302a; --up: #8fd19b; --down: #f0a08a; --cell: #1f1d17; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
main { padding: 12px 16px 32px; max-width: 1600px; margin: 0 auto; }
h2 { font-size: 16px; margin: 28px 0 8px; }
.pair { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 900px) { .pair { grid-template-columns: 1fr 1fr; } }
body[data-show="before"] .pair, body[data-show="after"] .pair { grid-template-columns: 1fr; }
body[data-show="before"] figure.after, body[data-show="after"] figure.before { display: none; }
figure { margin: 0; }
figcaption { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
img { width: 100%; height: auto; display: block; border-radius: 4px; }
img.px { image-rendering: pixelated; }
.overview img { max-width: 750px; }
.bars { display: grid; gap: 10px; }
.band { display: grid; grid-template-columns: 7.5em 1fr; gap: 4px 10px; align-items: center; font-size: 13px; }
.band > span { color: var(--muted); grid-row: span 2; }
.bar { display: flex; height: 18px; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar i:hover { outline: 2px solid var(--fg); outline-offset: -2px; }
.tag { font-size: 11px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin: 10px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 640px; width: 100%; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-weight: 600; }
thead tr:first-child th { border-bottom: none; }
th.grp { text-align: center; border-left: 1px solid var(--rule); }
td.b { border-left: 1px solid var(--rule); color: var(--muted); }
td.up { color: var(--up); font-weight: 600; }
td.down { color: var(--down); font-weight: 600; }
td.zero { color: var(--muted); opacity: .5; }
</style>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<script src="data.js"></script>
</head>
<body>
<header id="mock" class="bar"><strong>Ground by water</strong>
<span class="grp" data-k="show"><span class="lab">show</span><button data-v="pair">Pair</button><button data-v="before">Before</button><button data-v="after">After</button></span>
<span class="grp" data-k="seed"><span class="lab">table seed</span><button data-v="17">17</button><button data-v="1337">1337</button><button data-v="42">42</button></span>
<span class="grp" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span>
</header>
<main>
<h2>Colony start, 32 px</h2>
<div class="pair">
<figure class="before"><figcaption>before</figcaption><img src="before-close.png" alt="today's ground at the colony start, 32 px"></figure>
<figure class="after"><figcaption>after</figcaption><img src="after-close.png" alt="ground following water and mountains at the colony start, 32 px"></figure>
</div>

<h2>Valley, 12 px</h2>
<div class="pair">
<figure class="before"><figcaption>before</figcaption><img src="before-wide.png" alt="today's ground in the valley, 12 px"></figure>
<figure class="after"><figcaption>after</figcaption><img src="after-wide.png" alt="ground following water and mountains in the valley, 12 px"></figure>
</div>

<h2>Whole map, 1 px per tile</h2>
<div class="pair overview">
<figure class="before"><figcaption>before</figcaption><img class="px" src="overview-before.png" alt="whole map, today's ground"></figure>
<figure class="after"><figcaption>after</figcaption><img class="px" src="overview-after.png" alt="whole map, ground following water and mountains"></figure>
</div>

<h2>Ground by distance from water</h2>
<div class="legend" id="legend"></div>
<div class="bars" id="bars"></div>

<h2>Share of ground, %</h2>
<div class="scroll"><table id="table"></table></div>
</main>
<script>
(() => {
  const { grounds, seeds } = window.GROUND;
  const BANDS = [['1-3', '1–3 tiles'], ['4-12', '4–12 tiles'], ['13-39', '13–39 tiles'], ['40+', '40+ tiles'], ['mtn<=2', '≤2 from rock']];
  const legend = document.getElementById('legend');
  legend.innerHTML = grounds.map((g) => `<span><i class="sw" style="background:${g.colour}"></i>${g.name}</span>`).join('');
  const bar = (shares) => '<div class="bar">' + grounds.filter((g) => shares[g.id]).map((g) => `<i style="width:${shares[g.id]}%;background:${g.colour}" title="${g.name} ${shares[g.id]}%"></i>`).join('') + '</div>';
  const fmt = (v) => (v ? v.toFixed(1) : '·');
  function render(state) {
    document.body.dataset.show = state.show;
    const s = seeds[state.seed];
    document.getElementById('bars').innerHTML = BANDS.map(([k, label]) =>
      `<div class="band"><span>${label}</span><div><div class="tag">before</div>${bar(s[k].before)}</div><div><div class="tag">after</div>${bar(s[k].after)}</div></div>`).join('');
    const used = grounds.filter((g) => BANDS.some(([k]) => (s[k].before[g.id] ?? 0) >= 0.5 || (s[k].after[g.id] ?? 0) >= 0.5));
    let html = '<thead><tr><th></th>' + BANDS.map(([, l]) => `<th class="grp" colspan="2">${l}</th>`).join('') + '</tr><tr><th>seed ' + state.seed + '</th>' + BANDS.map(() => '<th>before</th><th>after</th>').join('') + '</tr></thead><tbody>';
    for (const g of used) {
      html += `<tr><td><i class="sw" style="background:${g.colour}"></i> ${g.name}</td>`;
      for (const [k] of BANDS) {
        const b = s[k].before[g.id] ?? 0, a = s[k].after[g.id] ?? 0;
        const cls = Math.abs(a - b) < 2 ? (a ? '' : 'zero') : a > b ? 'up' : 'down';
        html += `<td class="b ${b ? '' : 'zero'}">${fmt(b)}</td><td class="${cls}">${fmt(a)}</td>`;
      }
      html += '</tr>';
    }
    document.getElementById('table').innerHTML = html + '</tbody>';
  }
  const ui = F4X.bar((state) => render(state));
  render(ui.state);
})();
</script>
</body>
</html>
