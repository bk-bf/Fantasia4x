<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bog ground</title>
<style>
:root { --bg: #ece6d6; --fg: #2a251d; --mute: #6d6555; --line: #c9c0aa; --cell: #ded6c2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131116; --fg: #f4ecd8; --mute: #948c7c; --line: #3a3444; --cell: #1b1820; } }
:root[data-theme="dark"] { --bg: #131116; --fg: #f4ecd8; --mute: #948c7c; --line: #3a3444; --cell: #1b1820; }
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
main { padding: 12px 12px 120px; max-width: 2640px; margin: 0 auto; }
h2 { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 28px 0 8px; }
h2:first-child { margin-top: 0; }
figure { margin: 0; min-width: 0; }
figcaption { font-size: 12px; margin-bottom: 4px; color: var(--mute); }
figcaption b { color: var(--fg); font-weight: 650; }
.frame { overflow: auto; border: 1px solid var(--line); background: var(--cell); max-height: 88vh; }
.frame img { display: block; width: 100%; height: auto; }
body[data-zoom="1"] .frame img { width: 1280px; max-width: none; image-rendering: pixelated; }
body[data-zoom="2"] .frame img { width: 2560px; max-width: none; image-rendering: pixelated; }
#scene { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { body[data-show="pair"] #scene { grid-template-columns: 1fr 1fr; } }
body[data-show="today"] #scene .new, body[data-show="new"] #scene .old { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.row figure { max-width: 100%; overflow-x: auto; }
.row + .row { margin-top: 14px; }
.row h3 { flex: 0 0 100%; margin: 0; font-size: 12px; font-weight: 650; color: var(--fg); }
.crop { display: block; width: 660px; height: 460px; max-width: none; border: 1px solid var(--line); background: var(--cell); image-rendering: pixelated; }
.row figure.on .crop { outline: 2px solid var(--fg); outline-offset: -2px; }
</style>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
</head>
<body>
<header id="mock">
  <div class="mrow"><strong>Bog ground</strong><button id="mockhide">Hide · `</button></div>
  <div class="mrow"><span class="grp" data-k="motion" data-def="s2"><span class="lab">still water</span><button data-v="s1">Faint</button><button data-v="s2">Soft</button><button data-v="s3">Gentle</button></span></div>
  <div class="mrow"><span class="grp" data-k="node" data-def="off"><span class="lab">today's bog node</span><button data-v="on">On</button><button data-v="off">Off</button></span></div>
  <div class="mrow"><span class="grp" data-k="show"><span class="lab">show</span><button data-v="pair">Pair</button><button data-v="today">Today</button><button data-v="new">Still water</button><span class="lab">flip · T</span></span></div>
  <div class="mrow"><span class="grp" data-k="view"><span class="lab">view</span><button data-v="ring">Bog against mud</button><button data-v="grass">By grass and water</button></span></div>
  <div class="mrow"><span class="grp" data-k="zoom"><span class="lab">zoom</span><button data-v="fit">Fit</button><button data-v="1">1×</button><button data-v="2">2×</button></span></div>
  <div class="mrow"><span class="grp" data-k="theme"><span class="lab">page</span><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span></div>
  <p class="mnote">game renderer · dev save · noon · 32 px tiles · 8 fps · software GL, its pale vertical band is not the change</p>
</header>
<main>
<h2 id="where"></h2>
<div id="scene">
  <figure class="old"><figcaption id="oldcap"></figcaption><div class="frame"><img id="old" alt=""></div></figure>
  <figure class="new"><figcaption id="newcap"></figcaption><div class="frame"><img id="new" alt=""></div></figure>
</div>

<h2>Edges and motion, 2×</h2>
<div id="edges"></div>
</main>
<script>
(() => {
  const STEP = { s1: 'Faint', s2: 'Soft', s3: 'Gentle' };
  const WHERE = { ring: 'Tile 145, 347', grass: 'Tile 287, 311' };
  const EDGES = {
    ring: [['mud', 'Bog against mud'], ['clay', 'Bog against clay and mud']],
    grass: [['clay', 'Bog against clay'], ['moss', 'Bog against mud and moss']]
  };
  const img = (view, v) => `img/${view}-${v}.webp`;
  const crop = (label, url, on) => `<figure${on ? ' class="on"' : ''}><figcaption><b>${label}</b></figcaption><img class="crop" src="${url}" alt="${label}"></figure>`;
  function render(s) {
    document.body.dataset.show = s.show;
    document.body.dataset.zoom = s.zoom;
    document.getElementById('where').textContent = WHERE[s.view];
    const today = s.node === 'on' ? 'today' : 'bare';
    const todayLabel = s.node === 'on' ? 'Today' : 'Today · no node';
    const old = document.getElementById('old');
    old.src = img(s.view, today);
    old.alt = todayLabel;
    document.getElementById('oldcap').innerHTML = `<b>${todayLabel}</b>`;
    const next = document.getElementById('new');
    next.src = img(s.view, s.motion);
    next.alt = 'Still water · ' + STEP[s.motion];
    document.getElementById('newcap').innerHTML = `<b>Still water · ${STEP[s.motion]}</b>`;
    const rows = EDGES[s.view].map(([id, label]) => `<div class="row"><h3>${label}</h3>${[
      crop(todayLabel, img(s.view, `${id}-${today}`), false),
      ...Object.entries(STEP).map(([v, t]) => crop('Still water · ' + t, img(s.view, `${id}-${v}`), v === s.motion))
    ].join('')}</div>`);
    rows.push(`<div class="row"><h3>Lake</h3>${crop('Today', img(s.view, 'lake'), false)}</div>`);
    document.getElementById('edges').innerHTML = rows.join('');
  }
  const ui = F4X.bar((s) => render(s));
  render(ui.state);
  addEventListener('keydown', (ev) => {
    if (ev.key.toLowerCase() !== 't' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    ui.set('show', ui.state.show === 'today' ? 'new' : 'today');
  });
  const frames = [...document.querySelectorAll('#scene .frame')];
  let lead = null;
  for (const f of frames) f.addEventListener('scroll', () => {
    if (lead && lead !== f) return;
    lead = f;
    for (const o of frames) if (o !== f) { o.scrollLeft = f.scrollLeft; o.scrollTop = f.scrollTop; }
    requestAnimationFrame(() => { lead = null; });
  });
})();
</script>
</body>
</html>
