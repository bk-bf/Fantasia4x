<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water body motion</title>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<style>
  :root { --bg: #e9e4d8; --ink: #2a241c; --dim: #6c6354; --frame: #b9ae98; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121014; --ink: #eee6d4; --dim: #958c7c; --frame: #35303c; } }
  :root[data-theme="dark"] { --bg: #121014; --ink: #eee6d4; --dim: #958c7c; --frame: #35303c; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  #stage { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px 120px; box-sizing: border-box; width: 100%; }
  #stage.one { overflow: auto; }
  figure { margin: 0; cursor: pointer; }
  #stage.one figure { cursor: default; }
  canvas { display: block; image-rendering: pixelated; border: 1px solid var(--frame); }
  figcaption { padding: 3px 1px 0; font-weight: 600; }
  #vnote { color: var(--m-dim); max-width: 400px; }
</style>
</head>
<body>
<header id="mock">
  <div class="mrow"><strong>Water body motion</strong><span class="grp" data-k="view"><button data-v="all">All six</button><button data-v="one">One</button></span><button id="mockhide" title="Hide this panel; the backquote key brings it back">Hide · `</button></div>
  <div class="mrow"><span class="grp" data-k="v"><button data-v="today">Today</button><button data-v="downwind">Downwind</button><button data-v="ebb">Ebb and flow</button><button data-v="gusts">Gusts</button><button data-v="swell">Crossing swell</button><button data-v="all">Downwind, gusts, ebb</button></span></div>
  <div class="mrow"><span class="grp" data-k="weather" data-def="clear" id="weathers"><span class="lab">Weather</span></span></div>
  <div class="mrow"><span class="grp"><span class="lab">Wind</span><input id="wind" type="range" min="0" max="1" step="0.05" aria-label="Wind strength"><output id="windout"></output></span><span class="grp" data-k="dir" data-def="e"><span class="lab">Toward</span><button data-v="n">N</button><button data-v="ne">NE</button><button data-v="e">E</button><button data-v="se">SE</button><button data-v="s">S</button><button data-v="sw">SW</button><button data-v="w">W</button><button data-v="nw">NW</button></span></div>
  <div class="mrow"><span class="grp" data-k="veer" data-def="1"><span class="lab">Veer</span><button data-v="0">Off</button><button data-v="1">On</button></span><span class="grp" data-k="zoom" data-def="32"><span class="lab">Tile</span><button data-v="16">16 px</button><button data-v="32">32 px</button><button data-v="64">64 px</button></span><span class="grp" data-k="speed" data-def="1"><span class="lab">Speed</span><button data-v="0.5">½×</button><button data-v="1">1×</button><button data-v="2">2×</button></span></div>
  <p class="mnote" id="vnote"></p>
  <p class="mnote">generated lake · the grass is a stand-in · water is the game's shader</p>
</header>
<main id="stage"></main>
<script src="../fantasia4x-hud/ambient.js"></script>
<script src="shader.js"></script>
<script src="water.js"></script>
</body>
</html>
