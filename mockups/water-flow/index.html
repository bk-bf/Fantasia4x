<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River flow</title>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<style>
  :root { --bg: #e9e4d8; --ink: #2a241c; --frame: #b9ae98; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121014; --ink: #eee6d4; --frame: #35303c; } }
  :root[data-theme="dark"] { --bg: #121014; --ink: #eee6d4; --frame: #35303c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; touch-action: none; cursor: grab; }
  #stage.held { cursor: grabbing; }
  #stage.whole { cursor: default; }
  #frame { position: relative; outline: 1px solid var(--frame); }
  #frame canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  #water { image-rendering: pixelated; }
  #fail { position: fixed; inset: 12px auto auto 12px; margin: 0; }
</style>
</head>
<body>
<main id="stage"><div id="frame"><canvas id="water"></canvas><canvas id="arrows"></canvas></div></main>
<p id="fail"></p>
<header id="mock">
  <div class="mrow"><strong>River flow</strong><button id="mockhide">Hide · `</button></div>
  <div class="mrow"><span class="grp" data-k="river" data-def="streaks"><span class="lab">River</span><button data-v="glide">Glide</button><button data-v="streaks">Streaks</button><button data-v="lively">Lively</button><button data-v="off">As lake</button></span></div>
  <div class="mrow"><span class="grp" data-k="weather" data-def="clear" id="weathers"><span class="lab">Weather</span></span></div>
  <div class="mrow"><span class="grp"><span class="lab">Wind</span><input id="wind" type="range" min="0" max="1" step="0.05" aria-label="Wind strength"><output id="windout"></output></span><span class="grp" data-k="dir" data-def="e"><span class="lab">Toward</span><button data-v="n">N</button><button data-v="ne">NE</button><button data-v="e">E</button><button data-v="se">SE</button><button data-v="s">S</button><button data-v="sw">SW</button><button data-v="w">W</button><button data-v="nw">NW</button></span></div>
  <div class="mrow"><span class="grp" data-k="current" data-def="1"><span class="lab">Current</span><button data-v="0.5">½×</button><button data-v="1">1×</button><button data-v="2">2×</button></span><span class="grp"><span class="lab">Ice</span><input id="ice" type="range" min="0" max="100" step="1" aria-label="Ice cover"><output id="iceout"></output></span></div>
  <div class="mrow"><span class="grp" data-k="zoom" data-def="fit"><span class="lab">Tile</span><button data-v="fit">Fit</button><button data-v="16">16 px</button><button data-v="32">32 px</button><button data-v="64">64 px</button></span><span class="grp" data-k="speed" data-def="1"><span class="lab">Speed</span><button data-v="0">Pause</button><button data-v="0.5">½×</button><button data-v="1">1×</button><button data-v="2">2×</button></span></div>
  <div class="mrow"><span class="grp" data-k="at" data-def="mouth"><span class="lab">Look at</span><button data-v="mouth">Mouth</button><button data-v="outlet">Outlet</button><button data-v="narrows">Narrows</button><button data-v="rapids">Rapids</button><button data-v="free" hidden>Free</button></span><span class="grp" data-k="arrows" data-def="off"><span class="lab">Flow</span><button data-v="off">Off</button><button data-v="field">Arrows</button><button data-v="tiles">Tiles</button></span></div>
  <p class="mnote">mock map · grass is a stand-in · fast water freezes last</p>
</header>
<script src="../fantasia4x-hud/ambient.js"></script>
<script src="flow.js"></script>
<script src="shader.js"></script>
<script src="water.js"></script>
</body>
</html>
