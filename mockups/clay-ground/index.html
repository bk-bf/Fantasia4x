<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clay ground</title>
<style>
:root { --bg: #ece6d6; --fg: #2a251d; --mute: #6d6555; --line: #c9c0aa; --cell: #ded6c2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131116; --fg: #f4ecd8; --mute: #948c7c; --line: #3a3444; --cell: #1b1820; } }
:root[data-theme="dark"] { --bg: #131116; --fg: #f4ecd8; --mute: #948c7c; --line: #3a3444; --cell: #1b1820; }
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
main { padding: 12px 12px 120px; max-width: 2640px; margin: 0 auto; }
h2 { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 28px 0 8px; }
h2:first-child { margin-top: 0; }
figure { margin: 0; min-width: 0; }
figcaption { font-size: 12px; margin-bottom: 4px; color: var(--mute); }
figcaption b { color: var(--fg); font-weight: 650; }
.frame { overflow: auto; border: 1px solid var(--line); background: var(--cell); max-height: 88vh; }
.frame img { display: block; width: 100%; height: auto; }
body[data-zoom="1"] .frame img { width: 1280px; max-width: none; image-rendering: pixelated; }
body[data-zoom="2"] .frame img { width: 2560px; max-width: none; image-rendering: pixelated; }
#scene { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { body[data-show="pair"] #scene { grid-template-columns: 1fr 1fr; } }
body[data-show="today"] #scene .new, body[data-show="new"] #scene .old { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.row figure { max-width: 100%; overflow-x: auto; }
.row + .row { margin-top: 14px; }
.crop { border: 1px solid var(--line); background-repeat: no-repeat; image-rendering: pixelated; flex: none; }
.sheet { display: block; image-rendering: pixelated; border: 1px solid var(--line); max-width: none; }
</style>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
</head>
<body>
<header id="mock">
  <div class="mrow"><strong>Clay ground</strong><button id="mockhide">Hide · `</button></div>
  <div class="mrow"><span class="grp" data-k="dir"><span class="lab">direction</span><button data-v="a">A</button><button data-v="b">B</button><button data-v="c">C</button></span></div>
  <div class="mrow"><span class="grp" data-k="show"><span class="lab">show</span><button data-v="pair">Pair</button><button data-v="today">Today</button><button data-v="new">Direction</button><span class="lab">flip · T</span></span></div>
  <div class="mrow"><span class="grp" data-k="view"><span class="lab">view</span><button data-v="close">By moss and grass</button><button data-v="ring">Ringed in mud</button></span></div>
  <div class="mrow"><span class="grp" data-k="zoom"><span class="lab">zoom</span><button data-v="fit">Fit</button><button data-v="1">1×</button><button data-v="2">2×</button></span></div>
  <div class="mrow"><span class="grp" data-k="theme"><span class="lab">page</span><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span></div>
  <p class="mnote">game renderer · dev save · noon · 32 px tiles · software GL, its pale vertical band is not the change</p>
</header>
<main>
<h2 id="where"></h2>
<div id="scene">
  <figure class="old"><figcaption><b>Today</b></figcaption><div class="frame"><img id="old" alt="today's clay"></div></figure>
  <figure class="new"><figcaption id="newcap"></figcaption><div class="frame"><img id="new" alt=""></div></figure>
</div>

<h2>Edges, 2×</h2>
<div id="edges"></div>

<h2>Fire clay, 2×</h2>
<div class="row" id="fire"></div>

<h2>Tile set, 3×</h2>
<div class="row">
  <figure><figcaption><b>Today</b> · clay, blue clay, fire clay</figcaption><img class="sheet" src="img/sheet-today.png" alt="today's clay tile and deposits"></figure>
  <figure><figcaption><b>Reworked</b> · clay, blue clay as seams, low fire clay</figcaption><img class="sheet" src="img/sheet-new.png" alt="reworked clay tile and deposits"></figure>
</div>
</main>
<script>
(() => {
  const DIRS = {
    a: 'A · earth-toned clay, blue clay as seams',
    b: 'B · A with ragged edges',
    c: 'C · clay in pans over mud, ragged edges'
  };
  const WHERE = { close: 'Tile 173, 357', ring: 'Tile 312, 196' };
  const EDGES = {
    close: [['Clay against bog', 190, 160, 330, 230], ['Clay against moss and tall grass', 640, 380, 330, 230]],
    ring: [['Mud, bog, clay', 660, 60, 330, 250], ['Clay against grass and dirt', 180, 300, 330, 230]]
  };
  const FIRE = [['Today', 'fire-today'], ['Low mound', 'fire-low']];
  const src = (view, v) => `img/${view}-${v}.webp`;
  const crop = (label, url, x, y, w, h) =>
    `<figure><figcaption><b>${label}</b></figcaption><div class="crop" style="width:${w * 2}px;height:${h * 2}px;background-image:url(${url});background-size:2560px 1460px;background-position:${-x * 2}px ${-y * 2}px"></div></figure>`;
  function render(s) {
    document.body.dataset.show = s.show;
    document.body.dataset.zoom = s.zoom;
    document.getElementById('where').textContent = WHERE[s.view];
    document.getElementById('old').src = src(s.view, 'today');
    const img = document.getElementById('new');
    img.src = src(s.view, s.dir);
    img.alt = DIRS[s.dir];
    document.getElementById('newcap').innerHTML = `<b>${DIRS[s.dir]}</b>`;
    document.getElementById('edges').innerHTML = EDGES[s.view].map(([label, x, y, w, h]) =>
      `<div class="row">${[['Today · ' + label, 'today'], ['A', 'a'], ['B', 'b'], ['C', 'c']].map(([t, v]) => crop(t, src(s.view, v), x, y, w, h)).join('')}</div>`).join('');
  }
  document.getElementById('fire').innerHTML = FIRE.map(([t, f]) =>
    `<figure><figcaption><b>${t}</b></figcaption><img class="sheet" src="img/${f}.webp" width="1040" height="560" alt="${t} fire clay"></figure>`).join('');
  const ui = F4X.bar((s) => render(s));
  render(ui.state);
  addEventListener('keydown', (ev) => {
    if (ev.key.toLowerCase() !== 't' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    ui.set('show', ui.state.show === 'today' ? 'new' : 'today');
  });
  const frames = [...document.querySelectorAll('#scene .frame')];
  let lead = null;
  for (const f of frames) f.addEventListener('scroll', () => {
    if (lead && lead !== f) return;
    lead = f;
    for (const o of frames) if (o !== f) { o.scrollLeft = f.scrollLeft; o.scrollTop = f.scrollTop; }
    requestAnimationFrame(() => { lead = null; });
  });
})();
</script>
</body>
</html>
