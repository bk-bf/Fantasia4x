<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devlog thumbnail editor</title>
<link rel="stylesheet" href="thumb.css">
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--m-bg); color: var(--m-ink); font: 12px/16px system-ui, sans-serif; }
#mock select { flex: none; }
#mock output { min-width: 0; color: var(--m-dim); }
main { display: flex; flex-direction: column; gap: 5px; padding: 4px 12px 12px; }
#tools { padding-right: 180px; display: flex; flex-direction: column; gap: 5px; }
#tools .col { display: contents; }
#stage { position: relative; width: 1280px; height: 720px; flex: none; touch-action: none; outline: 1px solid var(--m-line); }
#stage.grab { cursor: grabbing; }
#stage.turn { cursor: alias; }
#hd { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; overflow: hidden; }
#ink { position: absolute; z-index: 2; margin: 0; padding: 0; border: 1px dashed var(--m-hot); background: rgb(0 0 0 / .55); resize: none; overflow: hidden; white-space: pre; outline: none; }
#preview { position: absolute; z-index: 101; top: 4px; right: 12px; display: block; width: 168px; aspect-ratio: 16/9; border-radius: 6px; background: #000; box-shadow: 0 0 0 1px var(--m-line); }
#layers { display: flex; flex-wrap: wrap; gap: 4px; }
#layers button { border: 1px solid var(--m-edge); background: var(--m-field); color: var(--m-text); font: inherit; padding: 2px 8px; cursor: pointer; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
#layers button.on { background: var(--m-hot); border-color: var(--m-hot); color: var(--m-on); }
#layers button:hover:not(.on) { border-color: var(--m-hot); color: var(--m-ink); }
#tools .chips { display: flex; align-items: center; gap: 12px; }
#warn .warn { color: var(--m-hot); font-weight: 600; white-space: nowrap; }
#props { height: 32px; padding: 3px 8px; display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; white-space: nowrap; align-items: center; gap: 6px 16px; border: 1px solid var(--m-line); background: var(--m-field); }
#props .r { display: flex; flex: none; align-items: center; gap: 5px; }
#props .l { color: var(--m-dim); }
#props .ck { display: inline-flex; align-items: center; gap: 3px; color: var(--m-text); cursor: pointer; }
#props input[type=range] { width: 100px; accent-color: var(--m-hot); }
#props input[type=number] { width: 58px; font: inherit; color: var(--m-ink); background: var(--m-field); border: 1px solid var(--m-edge); padding: 1px 4px; }
#props .warn { color: var(--m-hot); font-weight: 600; }
#props #zval { min-width: 40px; }
#props button { font: inherit; border: 1px solid var(--m-edge); background: none; color: var(--m-text); padding: 0 7px; min-height: 20px; cursor: pointer; }
#props button.on { background: var(--m-hot); border-color: var(--m-hot); color: var(--m-on); }
#props button:hover:not(.on) { border-color: var(--m-hot); color: var(--m-ink); }
#props input[type=text], #props select { font: inherit; color: var(--m-ink); background: var(--m-field); border: 1px solid var(--m-edge); padding: 1px 4px; min-width: 0; }
#props input[type=text] { width: 96px; }
#props input[type=color] { width: 26px; height: 20px; padding: 0; border: 1px solid var(--m-edge); background: none; }
#props output { font-variant-numeric: tabular-nums; min-width: 22px; text-align: center; }
#props .xy { color: var(--m-dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header id="mock" class="bar">
  <strong>Thumbnail editor</strong>
  <select id="variant" aria-label="Variant"></select>
  <span class="grp"><button id="undo">Undo</button><button id="redo">Redo</button><button id="reset">Reset</button></span>
  <span class="grp"><button id="png">Download PNG</button><button id="save">Save</button></span>
  <output id="status"></output>
  <nav><a href="index.html#title">Devlog</a></nav>
  <span class="grp" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span>
</header>
<main>
  <div id="tools">
    <div class="col"><div class="chips"><div id="layers"></div><span id="warn"></span></div><div id="props"></div></div>
    <img id="preview" alt="168 px preview">
  </div>
  <div id="stage"><section class="th on" id="th"></section><svg id="hd" xmlns="http://www.w3.org/2000/svg"></svg></div>
</main>
<script src="thumb-render.js"></script>
<script src="edit.js"></script>
</body>
</html>
