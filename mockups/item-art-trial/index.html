<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasia4x item art trial</title>
<style>
:root { --bg: #17151c; --ink: #f4ecd8; --dim: #948c7c; --hot: #e0a04a; --line: #3a3444; }
:root[data-theme="light"] { --bg: #ece6d6; --ink: #2a251d; --dim: #6d6555; --hot: #a65f12; --line: #c9c0aa; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #ece6d6; --ink: #2a251d; --dim: #6d6555; --hot: #a65f12; --line: #c9c0aa; } }
body { margin: 0; padding: 12px 16px 60px; background: var(--bg); color: var(--ink); font: 14px/20px system-ui, sans-serif; }
h1 { font-size: 18px; margin: 0 0 2px; }
p { margin: 0 0 14px; color: var(--dim); }
a { color: var(--hot); }
h2 { font-size: 14px; margin: 22px 0 6px; color: var(--hot); text-transform: uppercase; letter-spacing: .06em; }
img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); }
</style>
<script>
const theme = new URLSearchParams(location.search).get('theme');
if (theme && theme !== 'auto') document.documentElement.dataset.theme = theme;
</script>
</head>
<body>
<h1>Item art trial</h1>
<p>Approved and ported. The live version is the <a href="../fantasia4x-tileset/">database</a> and its <a href="../fantasia4x-tileset/yard.html">yard</a>.</p>
<h2>Generated yard, placed by rule</h2>
<img src="yard-integrated.png" alt="A smithy yard with dropped items drawn as piles, leaning tools and gear on the ground">
<h2>The same drops, one flat sprite per tile</h2>
<img src="yard-today.png" alt="The same yard with each drop drawn as a flat icon on its tile">
<h2>Props by storage class</h2>
<img src="props.png" alt="Fifteen storage classes, each at three fill stages and as a joined run">
<h2>Weapons, tools and gear</h2>
<img src="weapons.png" alt="Weapons and tools leaning on a wall and lying in grass">
<h2>Window icons</h2>
<img src="icons.png" alt="Thirty-seven items, each as the earlier drawing beside the pixel-placed icon">
</body>
</html>
