<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layered gear, before and after</title>
<style>
  :root { color-scheme: dark; --bg: #16120d; --ink: #e8dcc4; --dim: #a8987c; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  main { padding: 0 16px 16px; }
  h2 { font-size: 15px; margin: 22px 0 6px; color: var(--dim); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 12px; }
  figure { margin: 0; }
  img { display: block; width: 100%; height: auto; border: 1px solid #3a3022; }
  figcaption { margin-top: 4px; color: var(--dim); font-size: 13px; }
</style>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
</head>
<body>
<header id="mock" class="bar"><strong>Layered gear: hover list placement</strong></header>
<main>
<h2>Mockup ?win=gearlayers: before, the Torso list covers the Pack well</h2>
<div class="grid">
  <figure><img src="mockup-before-timber.png" alt=""><figcaption>Timber, before</figcaption></figure>
  <figure><img src="mockup-before-vellum.png" alt=""><figcaption>Vellum, before</figcaption></figure>
</div>
<h2>Mockup: after, the list hangs below the window under its card</h2>
<div class="grid">
  <figure><img src="mockup-after-timber.png" alt=""><figcaption>Timber, after</figcaption></figure>
  <figure><img src="mockup-after-vellum.png" alt=""><figcaption>Vellum, after</figcaption></figure>
</div>
<h2>Game: Gear tab before, 1024×548 (6879aa77)</h2>
<div class="grid">
  <figure><img src="game-before-timber.png" alt=""><figcaption>Timber</figcaption></figure>
  <figure><img src="game-before-vellum.png" alt=""><figcaption>Vellum</figcaption></figure>
</div>
<h2>Game: layered Gear tab, Torso hovered, 1024×394 (28841a3c)</h2>
<div class="grid">
  <figure><img src="game-after-timber.png" alt=""><figcaption>Timber</figcaption></figure>
  <figure><img src="game-after-vellum.png" alt=""><figcaption>Vellum</figcaption></figure>
</div>
</main>
</body>
</html>
