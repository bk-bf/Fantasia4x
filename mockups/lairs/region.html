<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lairs: the region</title>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<link rel="stylesheet" href="region.css">
</head>
<body>
<header id="mock">
  <div class="mrow"><strong>The region</strong><a href="./">Dens</a><button id="mockhide">Hide · `</button></div>
  <div class="mrow"><span class="grp" data-k="map" data-def="1000"><span class="lab">Map</span><button data-v="750">L 750</button><button data-v="1000">XL 1000</button></span><span class="grp" data-k="counts"><button data-v="spaced">Spaced</button><button data-v="today">Today</button></span></div>
  <div class="mrow"><span class="grp" data-k="colony"><span class="lab">Colony</span><button data-v="none">None</button><button data-v="settled">Settled</button><button data-v="growing">Growing</button></span></div>
  <div class="mrow"><span class="grp" data-k="speed" data-def="8"><button data-v="0">Pause</button><button data-v="1">1×</button><button data-v="8">8×</button><button data-v="60">60×</button></span><span class="grp" data-k="rings" data-def="on"><span class="lab">Ranges</span><button data-v="on">On</button><button data-v="off">Off</button></span></div>
  <div class="mrow"><span class="lab">Send</span><button data-wx="drought">Drought</button><button data-wx="storm">Storm</button><button data-wx="winter">Hard winter</button><button id="again">New world</button></div>
  <div class="mrow"><span class="grp" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span></div>
  <p class="mnote">a running model · every number invented</p>
</header>
<main id="screen">
  <div id="map"><canvas id="land"></canvas><canvas id="life"></canvas><div id="shade"></div></div>
  <aside id="side">
    <section id="when"></section>
    <section><h3>Prey and predators</h3><canvas id="graph" width="560" height="220"></canvas></section>
    <section><h3>Clocks</h3><div id="clocks"></div></section>
    <section id="pick"></section>
    <section><h3>What happened</h3><ol id="log"></ol></section>
  </aside>
  <div id="busy">Letting three years pass…</div>
</main>
<script src="../fantasia4x-tileset/gfx.js"></script>
<script src="eco-model.js"></script>
<script src="eco-view.js"></script>
</body>
</html>
