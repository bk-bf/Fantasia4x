<!doctype html>
<html lang="en">

<header id="mock">

  <div class="mrow"><span class="grp" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span></div>

<main id="screen">
  <div id="world"><canvas id="mapday"></canvas><canvas id="mapdusk"></canvas><canvas id="mapnight"></canvas><div id="marks"></div></div>
  <aside id="cards"></aside>
  <footer id="daybar"></footer>
  <div id="busy">Painting the lair…</div>
</main>
