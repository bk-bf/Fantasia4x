<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasia4x items in the world</title>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<link rel="stylesheet" href="database.css">
<link rel="stylesheet" href="yard.css">
</head>
<body class="dbase yard">
<header id="mock" class="bar">
  <strong>Items in the world</strong>
  <span class="grp" data-k="mode"><button data-v="integrated">Integrated</button><button data-v="today">Today</button></span>
  <span class="grp"><span class="lab">Seed</span><button id="prev">&lsaquo;</button><output id="seed"></output><button id="next">&rsaquo;</button><button id="shuffle">Reshuffle</button></span>
  <span class="grp" data-k="labels"><span class="lab">Labels</span><button data-v="off">Off</button><button data-v="on">On</button></span>
  <span class="grp" data-k="zoom" data-def="2"><span class="lab">Zoom</span><button data-v="1">1x</button><button data-v="2">2x</button><button data-v="3">3x</button></span>
  <nav><a href="./">Database</a><a href="motion.html">Motion</a></nav>
  <span class="grp" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span>
</header>
<main id="sheet"></main>
<script src="registry-scripts.js"></script>
<script src="load.js" data-then="world-yard.js world-scene.js yard.js"></script>
</body>
</html>
