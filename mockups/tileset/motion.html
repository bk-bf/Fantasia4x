<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasia4x motion</title>
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<link rel="stylesheet" href="database.css">
<link rel="stylesheet" href="motion.css">
</head>
<body class="dbase motion">
<header id="mock" class="bar">
  <strong>Motion</strong>
  <span class="grp" data-k="lvl" data-def="3"><button data-v="0">0 Today</button><button data-v="1">1 Procedural</button><button data-v="2">2 Rigged</button><button data-v="3">3 Pushed</button></span>
  <span class="grp" data-k="speed" data-def="1"><button data-v="0">Paused</button><button data-v="1">1x</button><button data-v="2">2x</button><button data-v="4">4x</button></span>
  <span class="grp" data-k="cad"><button data-v="step">Stepped</button><button data-v="smooth">Smooth</button></span>
  <span class="grp" data-k="zoom" data-def="2"><span class="lab">Zoom</span><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button></span>
  <span class="grp" data-k="frames" data-def="0"><button data-v="0">Loop</button><button data-v="1">Frames</button></span>
  <span class="grp"><button id="pin">Pin this instant</button><output id="clock"></output></span>
  <span id="cost"></span>
  <nav><a href="./">Database</a><a href="yard.html">Yard</a></nav>
  <span class="grp" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></span>
</header>
<main id="sheet"></main>
<script src="gfx.js"></script>
<script src="mat.js"></script>
<script src="world.js"></script>
<script src="flora.js"></script>
<script src="build.js"></script>
<script src="actors.js"></script>
<script src="colony.js"></script>
<script src="scene.js"></script>
<script src="motion-rig-core.js"></script>
<script src="motion-rig-pawn.js"></script>
<script src="motion-rig-beast.js"></script>
<script src="motion-poses.js"></script>
<script src="motion-bake.js"></script>
<script src="motion-timeline.js"></script>
<script src="motion-fx.js"></script>
<script src="motion-stage.js"></script>
<script src="motion-sheet.js"></script>
<script src="motion.js"></script>
</body>
</html>
