<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasia4x zoom options</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../fantasia4x-hud/chrome.css">
<script src="../fantasia4x-hud/chrome.js"></script>
<style>
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; background: #000; cursor: grab; touch-action: none; }
#stage.drag { cursor: grabbing; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; }
#read b { color: var(--m-ink); font-weight: 400; }
#note { position: absolute; left: 8px; bottom: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); padding: 2px 8px; font-size: 16px; pointer-events: none; }
#zbusy { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 6px 14px; }
</style>
</head>
<body>
<header id="mock">
  <div class="mrow"><strong>Zoom options</strong><a href="./">Catalogue</a><button id="mockhide" title="Hide this panel; the backquote key brings it back">Hide · `</button></div>
  <div class="mrow"><span class="grp" data-k="mode"><span class="lab">Wheel</span><button data-v="snap">Snap</button><button data-v="steps">2 px steps</button><button data-v="glide">Snap + glide</button></span></div>
  <div class="mrow"><span class="grp" data-k="half"><span class="lab">16 px</span><button data-v="drop">Drop pixels</button><button data-v="avg">Averaged</button></span></div>
  <div class="mrow"><span class="grp" id="jump"><span class="lab">Go to</span><button data-j="64">64</button><button data-j="32">32</button><button data-j="16">16</button><button data-j="far">Far</button></span></div>
  <p class="mnote" id="read"></p>
</header>
<div id="stage"><canvas id="view"></canvas><div id="zbusy">Drawing…</div><div id="note">Mockup · the 60 × 34 scene repeated 8 × 8 to stand in for a large map · markers invented</div></div>
<script src="gfx.js"></script>
<script src="mat.js"></script>
<script src="world.js"></script>
<script src="flora.js"></script>
<script src="build.js"></script>
<script src="actors.js"></script>
<script src="colony.js"></script>
<script src="scene.js"></script>
<script src="zoom.js"></script>
</body>
</html>
