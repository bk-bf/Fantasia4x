appId: dev.fantasia4x.app
productName: Fantasia4x
copyright: Copyright (C) 2025 bk — AGPL-3.0-or-later

directories:
  buildResources: build-resources
  output: dist-electron

files:
  - electron/**/*
  - build/**/*
  - package.json

icon: build-resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Game
  synopsis: A turn-based 4X colony chronicle.
  maintainer: bk <boychenkokirill@gmail.com>

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.strategy-games
  identity: null
