<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; height: 100%; background: transparent; font: 15px sans-serif; color: #fff; overflow: hidden; }
.bar { position: fixed; left: 20px; top: 20px; display: flex; gap: 10px; }
button { width: 120px; height: 40px; font: inherit; background: #2a3550; color: #fff; border: 2px solid #8af; border-radius: 6px; }
.panel { position: fixed; right: 20px; top: 20px; width: 260px; padding: 12px; background: rgba(10, 12, 20, 0.6); border: 1px solid #8af; border-radius: 8px; }
.spin { position: fixed; right: 40px; bottom: 40px; width: 60px; height: 60px; border: 6px solid #fa4; border-top-color: transparent; border-radius: 50%; animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bar">
  <button id="b1">Build</button>
  <button id="b2">Draft</button>
  <button id="b3">Harvest</button>
</div>
<div class="panel"><div id="last">no click yet</div><div id="dpr"></div></div>
<div class="spin" id="spin"></div>
<script>
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
const dpr = () => { document.getElementById('dpr').textContent = `dpr ${devicePixelRatio} view ${innerWidth}x${innerHeight}`; send({ kind: 'dpr', dpr: devicePixelRatio, w: innerWidth, h: innerHeight }); };
dpr();
addEventListener('resize', dpr);
document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
  document.getElementById('last').textContent = `clicked ${b.textContent}`;
  send({ kind: 'hud', id: b.id });
}));
document.addEventListener('pointerdown', (e) => {
  if (e.target === document.body || e.target === document.documentElement) send({ kind: 'world', x: e.clientX, y: e.clientY, button: e.button });
});
</script>
</body>
</html>
